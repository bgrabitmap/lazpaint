---
name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Lazarus on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -xeuo pipefail
        sudo bash -c 'apt-get update; apt-get install -y lazarus libgtk2.0-dev cppcheck pylint shellcheck' >/dev/null

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -xeuo pipefail
        instantfpc -Fu/usr/lib/lazarus/*/components/lazutils .github/workflows/make.pas
        delp -r "${PWD}"

    # The Homebrew Lazarus cask is disabled: install FPC from Homebrew and build lazbuild
    # for Cocoa from the Lazarus sources.
    - name: Install FPC and Lazarus on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -xeuo pipefail
        brew install fpc
        git clone --depth 1 --branch lazarus_4_4 https://gitlab.com/freepascal.org/lazarus/lazarus.git "$HOME/lazarus"
        make -C "$HOME/lazarus" lazbuild LCL_PLATFORM=cocoa
        echo "Lazarus v$("$HOME/lazarus/lazbuild" -v)"

    # Apple's linker (Xcode 16.3 and later) rejects the Objective-C method lists written by
    # FPC 3.2.2 when targeting macOS 11 (aarch64 default): "malformed method list atom".
    # A lower deployment target avoids the problem
    # (https://forum.lazarus.freepascal.org/index.php/topic,70698.0.html).
    # A ~/.fpc.cfg would replace the default configuration, so append to the Homebrew one.
    - name: Configure FPC on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -xeuo pipefail
        FPCCFG="$(ls "$(brew --prefix)/etc/fpc.cfg" /etc/fpc.cfg 2>/dev/null | head -1)"
        test -n "$FPCCFG"
        cat >> "$FPCCFG" <<CFG
        #IFDEF Darwin
        #IFDEF CPUAARCH64
        -WM10.15
        #ENDIF
        #ENDIF
        CFG
        mkdir -p "$HOME/.lazarus"
        cat > "$HOME/.lazarus/environmentoptions.xml" <<XML
        <?xml version="1.0" encoding="UTF-8"?>
        <CONFIG><EnvironmentOptions><LazarusDirectory Value="$HOME/lazarus/"/><CompilerFilename Value="$(which fpc)"/><FPCSourceDirectory Value=""/></EnvironmentOptions></CONFIG>
        XML

    - name: Build on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -xeuo pipefail
        export PATH="$HOME/lazarus:$PATH"
        export INSTANTFPCOPTIONS="-Fu$HOME/lazarus/components/lazutils"
        echo "Lazarus v$(lazbuild -v)"
        instantfpc .github/workflows/make.pas build
        delp -r "${PWD}"

    - name: Get Lazarus installer from cache on Windows
      if: runner.os == 'Windows'
      id: cache-lazarus
      uses: actions/cache@v6
      with:
        path: lazarus-installer
        key: ${{ runner.os }}-lazarus-installer-4.0

    - name: Download Lazarus installer if not cached on Windows
      if: runner.os == 'Windows' && steps.cache-lazarus.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path lazarus-installer
        $Uri = 'http://consume.o2switch.net/lazarus/lazarus-4.0-fpc-3.2.2-win64.exe'
        $OutFile = "lazarus-installer\lazarus-setup.exe"
        Invoke-WebRequest -Uri $Uri -OutFile $OutFile

    - name: Install Lazarus on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $Installer = "lazarus-installer\lazarus-setup.exe"
        & $Installer /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
    
    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $Env:PATH+=';C:\Lazarus'
        $Env:PATH+=';C:\Lazarus\fpc\3.2.2\bin\x86_64-win64'
        (Get-Command 'lazbuild').Source | Out-Host
        (Get-Command 'instantfpc').Source | Out-Host
        instantfpc '-FuC:\Lazarus\components\lazutils' .github/workflows/make.pas
        delp -r $PWD.Path
